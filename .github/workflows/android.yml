name: android
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Метка сборки: пакет .dbg_<tag>, имя «OC <tag>» (v2, v3, ...)"
        required: false
        default: ""
  push:
    branches: [custom]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK packages
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BIN=$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | head -1)
          yes | "$BIN/sdkmanager" --licenses > /dev/null
          "$BIN/sdkmanager" "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace ${TAG:+-PcustomTag=$TAG}
        env:
          TAG: ${{ inputs.tag }}

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug${{ inputs.tag && format('-{0}', inputs.tag) || '' }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
