name: android
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Метка сборки: пакет .dbg_<tag>, имя «OC <tag>» (v2, v3, ...)"
        required: false
        default: ""
      ring:
        description: "Толщина кольца контекста, dp (1.0, 1.25, ...)"
        required: false
        default: "1.0"
      variant:
        description: "AssembleBenchmark (release-like, быстрая) или AssembleDebug"
        required: false
        default: "Benchmark"
      task:
        description: "Явная задача Gradle (например :app:compileDebugKotlin для быстрой проверки)"
        required: false
        default: ""

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK packages
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BIN=$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | head -1)
          yes | "$BIN/sdkmanager" --licenses > /dev/null
          "$BIN/sdkmanager" "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: ./gradlew ${TASK:-:app:assemble${VARIANT:-Debug}} --stacktrace ${TAG:+-PcustomTag=$TAG} ${RING:+-PringStroke=$RING}
        env:
          TAG: ${{ inputs.tag }}
          RING: ${{ inputs.ring }}
          VARIANT: ${{ inputs.variant || 'Debug' }}
          TASK: ${{ inputs.task }}

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.task == '' }}
        with:
          name: app-debug${{ inputs.tag && format('-{0}', inputs.tag) || '' }}
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
